# Moneging Kotlin lint policy (detekt).
#
# This file is part of the Repository Harness. It is intentionally strict:
# the product code must bend to the policy, not the other way around.
#
# Tool: dev.detekt 2.0.0-alpha.6. All rules are active (`allRules`), any
# finding fails (`failOnSeverity = Info`), no baseline - all set and locked
# in the build-logic convention plugin
# (clients/kmp/build-logic/.../QualityConventionPlugin.kt). This file is
# layered over detekt's default config (`buildUponDefaultConfig = true`):
# detekt 2 only runs rules present in the effective configuration, so
# without the default underneath, `allRules` would activate only the rules
# named here. It therefore lists only overrides of the defaults.
#
# Coverage (detekt 2.0.0-alpha.6):
# - Type resolution: the Android compilations of each module
#   (sharedLogic/sharedUI: detektMainAndroid = commonMain + androidMain,
#   detektHostTestAndroid / detektDeviceTestAndroid = the test source sets;
#   androidApp: detektMain / detektTest and the per-variant tasks).
# - Without type resolution: iosMain/iosTest (and the other Apple/native
#   source sets). detekt 2.0.0-alpha.6 builds its Analysis API session for
#   the JVM platform only and registers compilation tasks for JVM/Android
#   targets only, so Kotlin/Native code cannot be type-resolved; the
#   detekt<SourceSet>SourceSet tasks still apply every non-type-resolution
#   rule to it.
# - Tests get the same rules as product code: the default config's
#   test-path `excludes` (and ImplicitUnitReturnType's `ignoreAnnotated:
#   [Test]`) are cleared below.

config:
  validation: true
  warningsAsErrors: true

# Every rule below had a default `excludes:` of test paths in detekt's
# default config; `[]` applies it to tests too.
comments:
  KDocReferencesNonPublicProperty:
    excludes: []
  UndocumentedPublicClass:
    excludes: []
  UndocumentedPublicFunction:
    excludes: []
  UndocumentedPublicProperty:
    excludes: []
complexity:
  StringLiteralDuplication:
    excludes: []
  TooManyFunctions:
    excludes: []
exceptions:
  InstanceOfCheckForException:
    excludes: []
  ThrowingExceptionsWithoutMessageOrCause:
    excludes: []
  TooGenericExceptionCaught:
    excludes: []
naming:
  FunctionNaming:
    # @Composable functions follow Compose's PascalCase convention (they are
    # conceptually factories for UI, not plain functions); this is detekt's
    # own documented knob for that convention, not a suppression.
    ignoreAnnotated: ['Composable']
    excludes: []
performance:
  ForEachOnRange:
    excludes: []
  SpreadOperator:
    excludes: []
potential-bugs:
  LateinitUsage:
    excludes: []
  MissingPackageDeclaration:
    excludes: []
  UnsafeCallOnNullableType:
    excludes: []
  ImplicitUnitReturnType:
    # Default ignoreAnnotated: ['Test'] exempts tests; tests get the rule too.
    ignoreAnnotated: []
style:
  MagicNumber:
    excludes: []

# Console output: only the one-line-per-finding report (detekt's own default
# selection); the full reports are still written under build/reports/detekt.
console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
    - 'IssuesReport'
    - 'FileBasedIssuesReport'
